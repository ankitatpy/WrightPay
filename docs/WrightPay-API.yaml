          example: 4
        limit:
          type: integer
          description: Maximum items returned in this page
          example: 20
        offset:
          type: integer
          description: Starting offset
          example: 0

    ExchangeRate:
      type: object
      required:
        - id
        - from
        - to
        - rate
        - timestamp
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: fx-11111111-1111-1111-1111-111111111111
        from:
          $ref: '#/components/schemas/Currency'
        to:
          $ref: '#/components/schemas/Currency'
        rate:
          type: number
          example: 89.500000
        timestamp:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ExchangeQuote:
      type: object
      required:
        - from
        - to
        - amount
        - rate
        - convertedAmount
      properties:
        from:
          $ref: '#/components/schemas/Currency'
          example: EUR
        to:
          $ref: '#/components/schemas/Currency'
          example: INR
        amount:
          type: number
          description: Source currency conversion amount
          example: 100.00
        rate:
          type: number
          description: Calculated exchange rate
          example: 89.500000
        convertedAmount:
          type: number
          description: Destination amount rounded to 2 decimal places
          example: 8950.00

    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Bad Request
        error:
          type: string
          example: Bad Request
