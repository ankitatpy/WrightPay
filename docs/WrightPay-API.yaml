        fee:
          type: number
          description: Fixed transfer execution fee
          example: 25.00
        exchangeRate:
          type: number
          description: Exchange rate applied to conversion
          example: 89.5000
        date:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    FormattedTransaction:
      type: object
      required:
        - id
        - userId
        - reference
        - date
        - recipient
        - amount
        - currency
        - fee
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: tx-11111111-1111-1111-1111-111111111111
        userId:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        reference:
          type: string
          example: WP-20260816-001
        date:
          type: string
          format: date-time
        recipient:
          type: string
          example: Rajesh Sharma
        amount:
          type: number
          example: 500.00
