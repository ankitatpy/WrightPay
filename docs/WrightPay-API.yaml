          $ref: '#/components/schemas/Currency'
        senderAmount:
          type: number
          nullable: true
          example: 500.00
        senderCurrency:
          $ref: '#/components/schemas/Currency'
          nullable: true
        recipientAmount:
          type: number
          nullable: true
          example: 45250.00
        recipientCurrency:
          $ref: '#/components/schemas/Currency'
          nullable: true
        fee:
          type: number
          example: 25.00
        exchangeRate:
          type: number
          nullable: true
          example: 90.5000
        status:
          $ref: '#/components/schemas/TransactionStatus'
        failureReason:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time

    PaginatedTransactionsResponse:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FormattedTransaction'
